<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>TANG TERMINAL — Global Market Monitor</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23070b08'/%3E%3Ctext x='2' y='12' font-family='monospace' font-size='11' fill='%2334f57a'%3ET%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/terminal.css" />
</head>
<body>
  <!-- Scanline / CRT ambience (purely decorative, cheap to render) -->
  <div class="crt-overlay" aria-hidden="true"></div>

  <!-- ======================= Top status bar ======================= -->
  <header id="titlebar" class="titlebar">
    <div class="titlebar-left">
      <span class="logo">▮▮ TANG TERMINAL</span>
      <span class="version" id="app-version">v1.0.0</span>
    </div>

    <div class="titlebar-center">
      <span class="status-pill" id="data-mode-pill" title="Active data adapter">MODE: DEMO</span>
      <span class="status-pill" id="feed-status-pill" title="Feed health">FEED: —</span>
      <span class="status-pill" id="ollama-pill" title="Ollama assistant status">AI: OFFLINE</span>
    </div>

    <div class="titlebar-right">
      <button class="tb-btn" id="btn-toggle-mode"  title="Switch data adapter (demo / live)">DATA: DEMO</button>
      <button class="tb-btn" id="btn-reset-layout" title="Restore default widget layout">RESET LAYOUT</button>
      <button class="tb-btn" id="btn-fullscreen"   title="Toggle borderless fullscreen (F11 also works)">⛶ FULLSCREEN</button>
      <span class="utc-clock" id="utc-clock" title="Coordinated Universal Time">--:--:-- UTC</span>
    </div>
  </header>

  <!-- ======================= Widget canvas ======================= -->
  <main id="canvas" class="canvas" aria-label="Market dashboard canvas">
    <!-- Widget panels are rendered here by js/main.js via the grid engine. -->
  </main>

  <!-- ======================= Bottom ticker ======================= -->
  <footer id="tickerbar" class="tickerbar" aria-label="Scrolling market ticker">
    <div class="ticker-track" id="ticker-track"></div>
  </footer>

  <!-- Classic scripts (no ES modules) so the app runs from file:// with zero build step. -->
  <script src="js/store.js"></script>
  <script src="js/data/universe.js"></script>
  <script src="js/data/adapter.js"></script>
  <script src="js/grid.js"></script>
  <script src="js/widgets/base.js"></script>
  <script src="js/widgets/clocks.js"></script>
  <script src="js/widgets/indices.js"></script>
  <script src="js/widgets/heatmap.js"></script>
  <script src="js/widgets/stocks.js"></script>
  <script src="js/widgets/metals.js"></script>
  <script src="js/ollama.js"></script>
  <script src="js/widgets/assistant.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
