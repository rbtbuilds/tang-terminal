name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-and-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Check Python
        run: python -m py_compile terminal/local-server.py
      - name: Check JavaScript
        shell: bash
        run: |
          while IFS= read -r -d '' script_file; do
            node --check "$script_file"
          done < <(find terminal/js -name '*.js' -print0)
      - name: Check private files are not tracked
        shell: bash
        run: |
          if git ls-files | grep -Eq '(^dist/|terminal/\.tang-terminal\.env$)'; then
            echo "A private release or local credential file is tracked."
            exit 1
          fi
      - name: Check whitespace
        run: git show --check --format= HEAD
